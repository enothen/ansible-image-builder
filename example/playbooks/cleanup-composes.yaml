---
- name: Playbook to delete old compose requests from Red Hat Insights Image Builder
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Get refresh token
      ansible.builtin.import_role:
        name: enothen.image_builder.get_refresh_token

    - name: Get previous composes
      ansible.builtin.import_role:
        name: enothen.image_builder.get_composes

    - name: Delete composes
      ansible.builtin.import_role:
        name: enothen.image_builder.delete_compose
