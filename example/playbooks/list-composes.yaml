---
- name: Playbook to list available composes in Red Hat's image builder service
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Get refresh token
      ansible.builtin.import_role:
        name: enothen.image_builder.get_refresh_token

    - name: Get previous composes
      ansible.builtin.import_role:
        name: enothen.image_builder.get_composes

    - name: List available composes
      ansible.builtin.import_role:
        name: enothen.image_builder.list_composes
